[package]
name = "medical_inventory"
version = "0.1.0"
edition = "2024"
description = "Local desktop tool for medical product inventory records"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "6"
eframe = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
